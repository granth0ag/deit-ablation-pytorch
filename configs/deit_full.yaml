# Experiment 3: Full DeiT - augmentation + distillation token + CNN teacher.
experiment_name: deit_full

model: deit
model_name: deit_small_distilled_patch16_224
num_classes: 100

teacher_model: regnety_160
distillation: true
distillation_alpha: 0.5

dataset: cifar100
data_dir: ./data
image_size: 224

augmentation: deit
mixup: true

batch_size: 128
epochs: 30
lr: 0.0005
weight_decay: 0.05
warmup_epochs: 3

num_workers: 4
seed: 42
output_dir: ./experiments/deit_full