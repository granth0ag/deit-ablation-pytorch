# Experiment 2: Same ViT, but DeiT-style augmentation. No distillation.
experiment_name: vit_deit_aug

model: vit
model_name: vit_small_patch16_224
num_classes: 100

dataset: cifar100
data_dir: ./data
image_size: 224

augmentation: deit
mixup: true
distillation: false

batch_size: 128
epochs: 30
lr: 0.0005
weight_decay: 0.05


num_workers: 4
seed: 42
output_dir: ./experiments/vit_deit_aug